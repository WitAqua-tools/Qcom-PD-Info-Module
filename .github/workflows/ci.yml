name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the module
        run: ./validate.sh

      # sh -n in validate.sh only catches syntax. These run in ksud's shell as
      # root before the framework is up, so the quoting bugs shellcheck finds
      # are the ones that would be worst to ship.
      - name: Shellcheck
        run: shellcheck --shell=sh customize.sh post-fs-data.sh uninstall.sh

      # The apk is built with Soong, against an android tree, so it cannot be
      # built here - a release takes it from the app repository. Packing a
      # stand-in is still worth doing: what this checks is the zip's shape,
      # which is what decides whether the installer takes the module at all.
      - name: Pack with a stand-in apk
        run: |
          set -euo pipefail
          printf 'not an apk\n' > /tmp/PdInfoRoot.apk
          ./pack.sh /tmp/PdInfoRoot.apk

      # A module whose post-fs-data.sh did not reach the zip root installs
      # cleanly and then does nothing, which is the failure this repository is
      # most likely to ship. Check the zip rather than trust the packer.
      - name: Check zip layout
        run: |
          set -euo pipefail
          for zip in out/*.zip; do
            echo "== $zip"
            # -Z1 lists paths and nothing else, so these are exact matches on
            # the zip root rather than on a listing's columns.
            names=$(unzip -Z1 "$zip")
            echo "$names"

            for required in module.prop customize.sh post-fs-data.sh uninstall.sh PdInfoRoot.apk; do
              if ! printf '%s\n' "$names" | grep -qx "$required"; then
                echo "::error::$zip has no $required at its root"
                exit 1
              fi
            done
            if printf '%s\n' "$names" | grep -qx 'install.sh'; then
              echo "::error::$zip has install.sh; the installer would take its legacy path"
              exit 1
            fi
            if printf '%s\n' "$names" | grep -qi '\.zip$'; then
              echo "::error::$zip contains a zip"
              exit 1
            fi
            echo ok
          done

      # Deliberately no upload-artifact. It re-zips whatever it is given, so
      # the download would be a zip containing the module zip, and a zip of a
      # zip is not installable. And this one carries a stand-in apk anyway.
