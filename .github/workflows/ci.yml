name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the module
        run: ./validate.sh

      # sh -n in validate.sh only catches syntax. These run in ksud's shell as
      # root before the framework is up, so the quoting bugs shellcheck finds
      # are the ones that would be worst to ship.
      - name: Shellcheck
        run: shellcheck --shell=sh customize.sh post-fs-data.sh uninstall.sh

      # Build the app the same way a release does, so that a change over
      # there which stops compiling is caught here rather than at tag time.
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: WitAqua/packages_apps_QcomPdInfo
          path: app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # testkey.jks is the public AOSP debug key, so this needs no secret and
      # runs on a pull request from a fork the same as on main. Signed rather
      # than unsigned because an unsigned apk cannot be installed at all: the
      # point of the zip below is that somebody can flash it and try it.
      - name: Build the app
        working-directory: app
        env:
          STORE_FILE: ${{ github.workspace }}/testkey.jks
          STORE_PASSWORD: android
          KEY_ALIAS: android
          KEY_PASSWORD: android
        run: gradle --no-daemon assembleRelease

      # CI publishes to anybody who can read this repository, so the check that
      # matters here is the opposite of the release one: the release key must
      # never come out of this job, whatever a future edit does to the env
      # above.
      - name: Check the signature
        run: |
          set -euo pipefail
          apk=$(find app -name QcomPdInfoRoot.apk -path '*release*' -print -quit)
          [ -n "$apk" ] || { echo "::error::gradle produced no QcomPdInfoRoot.apk"; exit 1; }
          echo "apk: $apk"

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee certs.txt

          testkey=A40DA80A59D170CAA950CF15C18C454D47A39B26989D8B640ECD745BA71BF5DC
          release=F752D7144144BD80573E62E5F956990DEB6C7C46DC38FEDC910AFA1454E608CF
          got=$(sed -n 's/.*SHA-256 digest: //p' certs.txt | head -1 | tr -d ' :' | tr 'a-f' 'A-F')

          if [ "$got" = "$release" ]; then
            echo "::error::CI signed with the release key. Only tagged releases may use it"
            exit 1
          fi
          if [ "$got" != "$testkey" ]; then
            echo "::error::not signed with testkey.jks. Expected $testkey, got $got"
            exit 1
          fi

          echo "apk=$apk" >> "$GITHUB_ENV"

      - name: Pack
        run: ./pack.sh "$apk"

      # A module whose post-fs-data.sh did not reach the zip root installs
      # cleanly and then does nothing, which is the failure this repository is
      # most likely to ship. Check the zip rather than trust the packer.
      - name: Check zip layout
        run: |
          set -euo pipefail
          for zip in out/*.zip; do
            echo "== $zip"
            # -Z1 lists paths and nothing else, so these are exact matches on
            # the zip root rather than on a listing's columns.
            names=$(unzip -Z1 "$zip")
            echo "$names"

            for required in module.prop customize.sh post-fs-data.sh uninstall.sh QcomPdInfoRoot.apk; do
              if ! printf '%s\n' "$names" | grep -qx "$required"; then
                echo "::error::$zip has no $required at its root"
                exit 1
              fi
            done
            if printf '%s\n' "$names" | grep -qx 'install.sh'; then
              echo "::error::$zip has install.sh; the installer would take its legacy path"
              exit 1
            fi
            if printf '%s\n' "$names" | grep -qi '\.zip$'; then
              echo "::error::$zip contains a zip"
              exit 1
            fi
            echo ok
          done

      # upload-artifact re-zips whatever it is given, so it gets the module's
      # contents rather than the module zip: what downloads is then itself a
      # zip with module.prop at its root, which is what the installer expects.
      # Handing it the zip would produce a zip containing a zip, which is not
      # installable.
      - name: Lay the zip out for upload
        run: |
          set -euo pipefail
          rm -rf out/artifact
          mkdir -p out/artifact
          for zip in out/*.zip; do
            unzip -q "$zip" -d out/artifact
          done
          ls -l out/artifact

      - name: Publish the zip
        uses: actions/upload-artifact@v4
        with:
          # The name says which key it is because a test-signed build and a
          # release-signed one cannot replace each other: installing this and
          # then a release means uninstalling the app in between.
          name: qcom_pd_info-testkey-${{ github.sha }}
          path: out/artifact/
          if-no-files-found: error
          retention-days: 30
