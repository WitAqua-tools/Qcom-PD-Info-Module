name: Release

# Tag to release:
#
#   git tag v0.1.1 && git push origin --tags
#
# The version in the tag has to match module.prop, because module.prop is what
# the manager shows and the release URL is what it fetches - if they disagree
# the release exists at a URL nothing points to.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version
        id: module
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          id=$(sed -n 's/^id=//p' module.prop)
          version=$(sed -n 's/^version=//p' module.prop)

          if [ "$EVENT" = push ] && [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match module.prop, which says $version"
            exit 1
          fi

          {
            echo "id=$id"
            echo "version=$version"
            echo "zip=out/$id.zip"
          } >> "$GITHUB_OUTPUT"

      # Same checks as CI. A tag can be pushed at a commit CI never ran on, so
      # this is the run that actually has to be green.
      - name: Validate the module
        run: ./validate.sh

      - name: Shellcheck
        run: shellcheck --shell=sh customize.sh post-fs-data.sh uninstall.sh

      # The apk comes from the app repository's own release rather than being
      # built here: it is a Soong target and needs an android tree. Whichever
      # release is latest there is what this module ships.
      - name: Fetch the apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release download --repo WitAqua/packages_apps_QcomPdInfo \
               --pattern PdInfoRoot.apk --dir /tmp; then
            echo "::error::no PdInfoRoot.apk in the latest release of"
            echo "::error::WitAqua/packages_apps_QcomPdInfo - build it with"
            echo "::error::Soong and attach it to a release there first"
            exit 1
          fi
          ls -l /tmp/PdInfoRoot.apk

      - name: Pack
        run: ./pack.sh /tmp/PdInfoRoot.apk

      - name: Check zip layout
        run: |
          set -euo pipefail
          names=$(unzip -Z1 "${{ steps.module.outputs.zip }}")
          for required in module.prop customize.sh post-fs-data.sh uninstall.sh PdInfoRoot.apk; do
            printf '%s\n' "$names" | grep -qx "$required" || {
              echo "::error::the zip has no $required at its root"; exit 1; }
          done

      # update.json points the manager at releases/latest/download, so the
      # asset name must not change between releases - validate.sh checks that
      # the name it expects is the one pack.sh builds.
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ steps.module.outputs.version }}
          name: ${{ steps.module.outputs.id }} ${{ steps.module.outputs.version }}
          artifacts: ${{ steps.module.outputs.zip }}
          bodyFile: changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
