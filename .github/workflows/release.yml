name: Release

# Tag to release:
#
#   git tag v0.1.1 && git push origin --tags
#
# The version in the tag has to match module.prop, because module.prop is what
# the manager shows and update.json is what it fetches - if they disagree the
# release exists at a URL nothing points to.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        id: module
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          id=$(sed -n 's/^id=//p' module.prop)
          version=$(sed -n 's/^version=//p' module.prop)

          if [ "$EVENT" = push ] && [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match module.prop, which says $version"
            exit 1
          fi

          {
            echo "id=$id"
            echo "version=$version"
            echo "zip=out/$id.zip"
          } >> "$GITHUB_OUTPUT"

      # Same checks as CI. A tag can be pushed at a commit CI never ran on, so
      # this is the run that actually has to be green.
      - name: Validate the module
        run: ./validate.sh

      - name: Shellcheck
        run: shellcheck --shell=sh customize.sh post-fs-data.sh uninstall.sh

      # The app lives in its own repository, and is built here rather than
      # taken from a release there so that a module release is one action
      # rather than two that can drift apart.
      - name: Check out the app
        uses: actions/checkout@v7
        with:
          repository: WitAqua/packages_apps_QcomPdInfo
          # Pinned because this is another repository's branch, not ours: the
          # default branch is a release one that trails main, and the ROM's
          # manifest takes main. Unpinned, the two built different sources.
          ref: main
          path: app

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # The signature is what decides whether an existing install can be
      # updated, so a release that is not signed with this key is worse than no
      # release. Fail rather than fall back to an unsigned build.
      - name: Restore the signing key
        env:
          STORE_FILE_BASE64: ${{ secrets.STORE_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${STORE_FILE_BASE64:-}" ]; then
            echo "::error::no STORE_FILE secret. Push it from the private key"
            echo "::error::repository - see WitAqua-tools/Android-Keys."
            exit 1
          fi
          printf '%s' "$STORE_FILE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the app
        working-directory: app
        env:
          STORE_FILE: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      # An apk that came out unsigned would install once and then never update,
      # which is the failure worth catching before it is published rather than
      # after.
      - name: Check the signature
        run: |
          set -euo pipefail
          apk=$(find app -name QcomPdInfoRoot.apk -path '*release*' -print -quit)
          [ -n "$apk" ] || { echo "::error::gradle produced no QcomPdInfoRoot.apk"; exit 1; }
          echo "apk: $apk"

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt

          # The fingerprint recorded in WitAqua-tools/Android-Keys. Checking
          # it catches the secret having been replaced with a different key,
          # which would publish an update nothing can install over.
          expected="F752D7144144BD80573E62E5F956990DEB6C7C46DC38FEDC910AFA1454E608CF"
          got=$(sed -n 's/.*SHA-256 digest: //p' /tmp/certs.txt | head -1 | tr -d ' :' | tr 'a-f' 'A-F')
          if [ "$got" != "$expected" ]; then
            echo "::error::signed with the wrong key. Expected $expected, got $got"
            exit 1
          fi

          echo "apk=$apk" >> "$GITHUB_ENV"

      - name: Pack
        run: ./pack.sh "$apk"

      - name: Check zip layout
        run: |
          set -euo pipefail
          names=$(unzip -Z1 "${{ steps.module.outputs.zip }}")
          for required in module.prop customize.sh post-fs-data.sh uninstall.sh QcomPdInfoRoot.apk; do
            printf '%s\n' "$names" | grep -qx "$required" || {
              echo "::error::the zip has no $required at its root"; exit 1; }
          done

      # update.json points the manager at releases/latest/download, so the
      # asset name must not change between releases - validate.sh checks that
      # the name it expects is the one pack.sh builds.
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: ${{ steps.module.outputs.version }}
          name: ${{ steps.module.outputs.id }} ${{ steps.module.outputs.version }}
          artifacts: ${{ steps.module.outputs.zip }}
          bodyFile: changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
